<script>
const D=JSON.parse(document.getElementById('data').textContent);
D.lessons.forEach(l=>{l.s=l.s||(D.sent&&D.sent[l.id])||[]});delete D.sent;
const app=document.getElementById('app');
let V={p:'home'},owner=false,art=null,Q=null,dirty=false,H=null,M=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function prog(){try{return JSON.parse(localStorage.getItem('prog')||'{}')}catch(e){return{}}}
function save(id,n){try{const p=prog();p[id]=Math.max(p[id]||0,n);localStorage.setItem('prog',JSON.stringify(p))}catch(e){}}
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const L=()=>D.lessons.find(l=>l.id===V.id);
function go(p,id,t){V={p,id,t:t||'learn',b:'w'};Q=null;H=null;M=null;FI=null;SEQ++;try{speechSynthesis.cancel()}catch(e){}render()}

function render(){
  if(V.p==='home')return home();
  if(V.p==='edit')return edit();
  if(V.p==='words')return words();
  if(V.p==='games')return games();
  if(V.p==='hpick')return hpick();
  if(V.p==='hang')return hang();
  if(V.p==='mpick')return mpick();
  if(V.p==='memory')return memory();
  if(V.p==='scenes')return scenes();
  if(V.p==='scene')return scene();
  if(V.p==='sedit')return sedit();
  const l=L();if(!l)return go('home');
  const B=V.b||'w',T=V.t||'learn';
  const SUB=B==='g'?[['rules','📖 Regole'],['gx','🧩 Esercizi']]:[['learn','👀 Impara'],['hear','👂 Ascolta'],['read','🔤 Leggi'],['write','✏️ Scrivi']];
  let h=`<div class="top"><button class="btn g" onclick="go('words')">⬅️</button><h1>${esc(l.emoji)} ${esc(l.name)}</h1></div>
  <div class="tabs">${[['w','📚<br>Parole'],['f','💬<br>Frasi'],['d','🗣️<br>Dialoghi'],['g','📏<br>Grammatica']].map(([k,n])=>`<button class="${B===k?'on':''}" style="font-size:10px;padding:8px 0" onclick="lt('${l.id}','${k}','${k==='g'?'rules':'learn'}')">${n}</button>`).join('')}</div>
  <div class="tabs">${SUB.map(([k,n])=>`<button class="${T===k?'on':''}" style="padding:8px 0;font-size:10px" onclick="lt('${l.id}','${B}','${k}')">${n}</button>`).join('')}</div>`;
  if(B==='g')h+=T==='gx'?gxW(l):gramW(l);
  else if(B==='w')h+=T==='learn'?gridW(l):quiz(l);
  else if(B==='f')h+=T==='learn'?phrW(l):T==='write'?sent(l,F(l)):T==='read'?gxW(l,[...(l.cz||[]),...(l.qa||[])],'fr'):quiz(l,F(l).map(x=>({w:x.t,e:x.e,i:x.i})));
  else h+=T==='learn'?dlgW(l):T==='write'?sent(l,(l.dlg||[]).filter(x=>x.who==='A').map(x=>({t:x.t,e:l.a||'🙋'})),1):dq(l);
  app.innerHTML=h;
}
function home(){
  app.innerHTML=`<h1>${esc(D.title)} <span style="font-size:16px;color:var(--mut)">A1</span></h1>
  <p class="note" style="margin-top:-8px">Tocca e impara 👇</p>
  <div style="display:grid;gap:14px">${[['words','📚','Unità'],['games','🎮','Giochi']].map(([p,e,n])=>`<button class="card" style="min-height:120px;flex-direction:row;gap:18px" onclick="go('${p}')"><span class="e" style="font-size:64px">${e}</span><span class="w" style="font-size:28px">${n}</span></button>`).join('')}</div>
  ${owner?`<p><button class="btn" style="width:100%;margin-top:22px" onclick="go('edit')">✏️ Gestisci (insegnante)</button></p>
  <p><button class="btn g" style="width:100%" onclick="PV=!PV;render()">${PV?'👁️ Anteprima studente: ATTIVA':'👁️ Anteprima studente'}</button></p>`:''}`;
}
function words(){
  const p=prog();
  app.innerHTML=`<div class="top"><button class="btn g" onclick="go('home')">⬅️</button><h1>📚 Unità</h1></div>
  <div class="grid">${VL().map(l=>`<button class="card" onclick="go('lesson','${l.id}')" ${l.hid?'style="opacity:.5"':''}><span class="e">${esc(l.emoji)}</span><span class="w">${l.hid?'🔒 ':''}${esc(l.name)}</span><span class="stars" style="color:#f59f00">${stars(p[l.id+'whear']&&p[l.id+'wread']&&p[l.id+'wwrite']?Math.min(p[l.id+'whear'],p[l.id+'wread'],p[l.id+'wwrite']):0)}</span></button>`).join('')}</div>`;
}
function quiz(l,src){
  const ew=uq((src||l.words).filter(w=>(w.e||w.i||'').trim()));if(ew.length<3)return '<p class="note" style="text-align:center">Presto!</p>';
  if(!Q||Q.k!==V.b+V.t+l.id)Q={k:V.b+V.t+l.id,qs:shuf(ew).slice(0,10),i:0,ok:0,tried:false};
  if(Q.i>=Q.qs.length){const pc=Q.ok/Q.qs.length,s=pc>=.9?3:pc>=.6?2:1;save(l.id+V.b+V.t,s);
    return `<div class="q"><div class="big">${s>1?'🎉':'💪'}</div><h1>${Q.ok} / ${Q.qs.length}</h1><div class="stars" style="color:#f59f00;font-size:40px">${stars(s)}</div><p><button class="btn" onclick="Q=null;render()">🔁 Ancora</button></p></div>`}
  const w=Q.qs[Q.i];
  if(V.t==='write'){setTimeout(()=>speak(w.w),300);return `<div class="q"><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  <div class="big" style="font-size:90px">${pic(w)}</div>
  <button class="btn g" onclick="speak(Q.qs[Q.i].w)">🔊</button>
  <div class="hint" id="hint">${esc(w.w.replace(/[^ ']/g,'_'))}</div>
  <input class="wi" id="wi" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')chk()">
  <button class="btn" style="width:100%" onclick="chk()">✔ Controlla</button>
  <p><button class="btn g" onclick="help()">💡 Aiuto</button></p>${skipBtn()}</div>`}
  Q.opts=shuf([w,...shuf(ew.filter(x=>x!==w)).slice(0,3)]);
  const hear=V.t==='hear';
  if(hear)setTimeout(()=>speak(w.w),300);
  return `<div class="q"><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>
  ${hear?`<button class="spk" onclick="speak(Q.qs[Q.i].w)">🔊</button>`:`<div class="big">${pic(w)}</div>`}
  <div class="grid" style="${V.b==='f'?'grid-template-columns:1fr':''}">${Q.opts.map((o,i)=>`<button class="card opt" id="o${i}" onclick="pick(${i})">${hear?`<span class="e">${pic(o)}</span>`:`<span class="w">${esc(o.w)}</span>`}</button>`).join('')}</div>${skipBtn()}</div>`;
}
function pick(i){
  const w=Q.qs[Q.i],b=document.getElementById('o'+i);
  if(Q.opts[i]===w){Q.busy=1;b.classList.add('ok');if(!Q.tried)Q.ok++;speak(w.w);setTimeout(()=>{Q.i++;Q.tried=false;Q.busy=0;render()},1100)}
  else{b.classList.add('ko');Q.tried=true}
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');
function chk(){const w=Q.qs[Q.i],i=document.getElementById('wi'),v=norm(i.value);if(!v)return;
  const full=norm(w.w),bare=norm(w.w.replace(/^(il|lo|la|i|gli|le|un|uno|una)\s+|^l'\s*/i,''));
  if(v===full||v===bare){Q.busy=1;i.classList.add('ok');if(!Q.tried)Q.ok++;speak(w.w);setTimeout(()=>{Q.i++;Q.tried=false;Q.busy=0;render()},1100)}
  else{i.classList.add('ko');Q.tried=true;setTimeout(()=>i.classList.remove('ko'),700)}}
function help(){Q.tried=true;document.getElementById('hint').textContent=Q.qs[Q.i].w}
function sent(l,S,onlyW){
  S=S||l.s||[];
  if(!S.length)return '<p class="note" style="text-align:center">Presto ci saranno le frasi!</p>';
  if(!Q||Q.k!=='s'+V.b+l.id)Q={k:'s'+V.b+l.id,qs:shuf(onlyW?S.map(x=>({x,ph:1})):S.flatMap(x=>[{x,ph:0},{x,ph:1}])).slice(0,10),i:0,ok:0,tried:false,pk:[],bank:null};
  if(Q.i>=Q.qs.length)return endW(l.id+V.b+'sent');
  const {x,ph}=Q.qs[Q.i],bar=`<div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>`,top=`${bar}<div class="big" style="font-size:80px">${pic(x)}</div><button class="btn g" onclick="speak(Q.qs[Q.i].x.t)">🔊</button>`;
  if(ph===0){

  return `<div style="overflow-x:auto"><table class="gt"><tr>${g.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${g.rows.map((r,i)=>`<tr>${r.map((c,j)=>{const k=rc[i]||cc[j]||'';return j?`<td${cl(k)}>${pc(c,g)}</td>`:`<td${cl(k)}>${esc(c)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function vT(g){const col=['cg','ce','ci'];
  return `<div style="overflow-x:auto"><table class="gt"><tr><th></th>${g.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr><tr><th></th>${g.verbs.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${PRON.map((p,i)=>`<tr><td>${p}</td>${g.stems.map((st,j)=>{const e=g.ends[j][i];return `<td>${esc(st)}<b class="${col[j]}">${esc(e)}</b></td>`}).join('')}</tr>`).join('')}</table></div>`}
function gramW(l){const a=l.g||[];if(!a.length)return '<p class="note" style="text-align:center">Presto!</p>';
  return a.map(g=>`<div class="card" style="align-items:stretch;text-align:left;margin-bottom:12px;padding:14px"><span class="w" style="color:var(--pri)">${esc(g.h)}</span>${g.k==='v'?vT(g):g.k==='t'?tT(g):g.k==='n'?`<p style="margin:8px 0 0;font-size:18px">${esc(g.t)}</p>`:(g.ex||[]).map(e=>`<button class="btn g" style="text-align:left;margin-top:8px;font-weight:600" data-t="${esc(e)}" onclick="speak(this.dataset.t)">🔊 ${esc(e)}</button>`).join('')}</div>`).join('')}
function pPh(v){L().ph=v.split('\n').filter(l=>l.includes('|')).map(l=>{const [e,...r]=l.split('|');return{e:e.trim(),t:r.join('|').trim()}})}
function pG(v){L().g=v.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]&&a.length>1).map(a=>({h:a[0],ex:a.slice(1).filter(Boolean)}))}
const F=l=>{const seen=new Set();return [...(l.ph||[]),...(l.s||[])].filter(x=>x.t&&!seen.has(x.t)&&seen.add(x.t))};
const pic=x=>x.i?`<img class="pi" alt="" src="img/${encodeURI(x.i)}">`:esc(x.e);
const uq=a=>{const seen=new Set();return a.filter(x=>!seen.has(x.i||x.e)&&seen.add(x.i||x.e))};
function lt(id,b,t){V={p:'lesson',id,b,t};Q=null;H=null;M=null;FI=null;SEQ++;try{speechSynthesis.cancel()}catch(e){}render()}
function dlgW(l){const dl=l.dlg||[];if(!dl.length)return '<p class="note" style="text-align:center">Presto!</p>';
  return `<button class="btn" style="width:100%;margin-bottom:14px" onclick="seq(L().dlg)">▶️ Ascolta tutto</button>`+dl.map((x,i)=>`<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;${x.who==='A'?'flex-direction:row-reverse':''}"><span style="font-size:34px">${x.who==='A'?esc(l.a||'🙋'):esc(l.b||'🧑')}</span><button class="card" style="width:auto;min-height:0;max-width:78%;padding:12px 14px;text-align:left;align-items:flex-start;${x.who==='A'?'background:var(--pri);color:#fff;border-color:var(--pri)':''}" onclick="seq([L().dlg[${i}]])"><span class="w" style="font-weight:600">${esc(x.t)}</span></button></div>`).join('')}
function dq(l){const qz=l.qz||[];if(!qz.length)return '<p class="note" style="text-align:center">Presto!</p>';
  const k='dq'+V.t+l.id,hear=V.t==='hear';
  if(!Q||Q.k!==k)Q={k,qs:shuf(qz),i:0,ok:0,tried:false,busy:0};
  if(Q.i>=Q.qs.length)return endW(l.id+'d'+V.t);
  const q=Q.qs[Q.i];Q.opts=shuf([{t:q.ok,r:1},...q.no.map(t=>({t,r:0}))]);
  if(hear)setTimeout(()=>{if(Q&&Q.k===k&&Q.qs[Q.i]===q)seq([{who:'B',t:q.q}])},300);
  return `<div class="q"><div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><div style="font-size:56px">${esc(l.b||'🧑')}</div>
  ${hear?`<button class="spk" style="width:96px;height:96px;font-size:46px;margin:8px auto" onclick="seq([{who:'B',t:Q.qs[Q.i].q}])">🔊</button>`:`<p style="font-size:24px;font-weight:700;margin:10px 0 14px">${esc(q.q)}</p>`}
  <div style="display:grid;gap:10px">${Q.opts.map((o,i)=>`<button class="card opt" id="so${i}" style="min-height:64px;padding:12px" onclick="spick(${i})"><span class="w">${esc(o.t)}</span></button>`).join('')}</div>${skipBtn()}</div>`}
/* ---- area insegnante ---- */
function edit(){
  if(!owner)return go('home');
  const l=L()||D.lessons[0];
  if(!l){D.lessons.push({id:'l'+Date.now(),name:'Nuova lezione',emoji:'📘',words:[]});return edit()}
  V.id=l.id;
  app.innerHTML=`<div class="ed"><div class="top"><button class="btn g" onclick="go('home')">⬅️</button><h1>✏️ Gestisci</h1></div>
  <div class="tabs" style="flex-wrap:wrap">${D.lessons.map(x=>`<button class="${x.id===l.id?'on':''}" style="flex:none;padding:8px 12px" onclick="V.id='${x.id}';edit()">${esc(x.emoji)} ${esc(x.name)}</button>`).join('')}<button style="flex:none;padding:8px 12px" onclick="addL()">➕</button></div>
  <div class="row"><input class="em" value="${esc(l.emoji)}" onchange="L().emoji=this.value;dirty=1"><input value="${esc(l.name)}" placeholder="Nome lezione" onchange="L().name=this.value;dirty=1"><button onclick="delL()">🗑️</button></div>
  <label style="display:flex;gap:12px;align-items:center;margin:10px 0;font-size:18px"><input type="checkbox" ${l.hid?'':'checked'} style="width:28px;height:28px;flex:none" onchange="L().hid=!this.checked"> 👁️ Visibile agli studenti</label>
  <p class="note">Parole (emoji + italiano, con articolo):</p>
  ${l.words.map((w,i)=>`<div class="row"><input class="em" value="${esc(w.e)}" onchange="L().words[${i}].e=this.value;dirty=1"><input value="${esc(w.w)}" onchange="L().words[${i}].w=this.value;dirty=1"><input class="em" style="width:100px;font-size:14px" placeholder="foto.jpg" value="${esc(w.i||'')}" onchange="L().words[${i}].i=this.value.trim();dirty=1"><button onclick="L().words.splice(${i},1);dirty=1;edit()">✖</button></div>`).join('')}
  <button class="btn g" style="width:100%;margin:6px 0 16px" onclick="L().words.push({w:'',e:'🙂'});dirty=1;edit()">➕ Aggiungi parola</button>
  <p class="note">Frasi brevi (emoji + frase):</p>
  ${(l.s=l.s||[]).map((x,i)=>`<div class="row"><input class="em" value="${esc(x.e)}" onchange="L().s[${i}].e=this.value;dirty=1"><input value="${esc(x.t)}" onchange="L().s[${i}].t=this.value;dirty=1"><input class="em" style="width:100px;font-size:14px" placeholder="foto.jpg" value="${esc(x.i||'')}" onchange="L().s[${i}].i=this.value.trim();dirty=1"><button onclick="L().s.splice(${i},1);dirty=1;edit()">✖</button></div>`).join('')}
  <button class="btn g" style="width:100%;margin:6px 0 16px" onclick="L().s.push({t:'',e:'🙂'});dirty=1;edit()">➕ Aggiungi frase</button>
  <p class="note">Frasi utili (emoji | frase):</p>
  <textarea onchange="pPh(this.value)">${esc((l.ph||[]).map(x=>x.e+' | '+x.t).join('\n'))}</textarea>
  <p class="note">Grammatica ed esercizi: scrivimeli in chat e li aggiorno io.</p>
  <p class="note">Dialoghi, grammatica ed esercizi: scrivimeli in chat e li aggiorno io.</p>
  <button class="btn" style="width:100%" onclick="pub()">💾 Scarica contenuti.json</button>
  <p class="note" id="msg">Le modifiche diventano visibili agli studenti solo dopo aver caricato su GitHub il file scaricato. Per le emoji usa la tastiera. Per una foto, scrivi il nome del file (cartella img) nella casella a destra.</p></div>`;
}
function addL(){const l={id:'l'+Date.now(),name:'Nuova lezione',emoji:'📘',words:[]};D.lessons.push(l);V.id=l.id;dirty=1;edit()}
function delL(){if(!confirm('Eliminare questa lezione?'))return;D.lessons=D.lessons.filter(x=>x.id!==V.id);V.id=null;dirty=1;edit()}
async function pub(){
  D.lessons.forEach(l=>{l.words=l.words.filter(w=>w.w.trim());l.s=(l.s||[]).filter(x=>x.t.trim())});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='contenuti.json';document.body.appendChild(a);a.click();a.remove();
  const m=document.getElementById('msg');if(m)m.textContent='File contenuti.json scaricato. Caricalo su GitHub al posto di quello vecchio per pubblicare.';
}
owner=/docente/.test(location.search+location.hash);
render();
(async()=>{try{const r=await fetch('contenuti.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.lessons){D.lessons=j.lessons;if(j.title)D.title=j.title;if(V.p==='home'||V.p==='words')render()}}}catch(e){}})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
