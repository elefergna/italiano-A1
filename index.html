function mkQ(k,build){const sv=PD.pos[k],seed=sv?sv.seed:(Math.random()*4294967296)>>>0;
  RNG=mul(seed);try{Q=build()}finally{RNG=null}
  Q.seed=seed;if(sv&&sv.i<Q.qs.length){Q.i=sv.i;Q.ok=sv.ok||0}}
function persist(){if(!PF.cur)return;let ch=false;
  if(Q&&Q.seed!=null&&Q.i<Q.qs.length){const o=PD.pos[Q.k];if(!o||o.i!==Q.i||o.ok!==Q.ok||o.seed!==Q.seed){PD.pos[Q.k]={seed:Q.seed,i:Q.i,ok:Q.ok};ch=true}}
  if(V.p==='lesson'){const l=PD.last;if(!l||l.id!==V.id||l.b!==V.b||l.t!==V.t){PD.last={id:V.id,b:V.b,t:V.t};ch=true}}
  if(ch)savePD()}

function quiz(l,src){
  const ew=uq((src||l.words).filter(w=>(w.e||w.i||'').trim()));if(ew.length<3)return '<p class="note" style="text-align:center">Presto!</p>';
  if(!Q||Q.k!==V.b+V.t+l.id)mkQ(V.b+V.t+l.id,()=>({k:V.b+V.t+l.id,qs:shuf(ew).slice(0,10),i:0,ok:0,tried:false}));
  if(Q.i>=Q.qs.length){if(PD.pos[Q.k]){delete PD.pos[Q.k];savePD()}const pc=Q.ok/Q.qs.length,s=pc>=.9?3:pc>=.6?2:1;save(l.id+V.b+V.t,s);

  else{b.classList.add('ko');Q.tried=true}
}

const norm=s=>s.toLowerCase().normalize('NFD').replace(/[^a-z]/g,'');
function chk(){const w=Q.qs[Q.i],i=document.getElementById('wi'),v=norm(i.value);if(!v)return;

function sent(l,S,onlyW){

  if(!Q||Q.k!=='s'+V.b+l.id)mkQ('s'+V.b+l.id,()=>({k:'s'+V.b+l.id,qs:shuf(onlyW?S.map(x=>({x,ph:1})):S.flatMap(x=>[{x,ph:0},{x,ph:1}])).slice(0,10),i:0,ok:0,tried:false,pk:[],bank:null}));

  <p><button class="btn g" onclick="helpS()">${ic('bulb')} Aiuto</button></p>${skipBtn()}</div>`;
}
function endW(key){if(Q&&PD.pos[Q.k]){delete PD.pos[Q.k];savePD()}const pc=Q.ok/Q.qs.length,st=pc>=.9?3:pc>=.6?2:1;save(key,st);

function nextS(){Q.i++;Q.tried=false;Q.bank=null;Q.pk=[];Q.busy=0;render()}
function pk(n){Q.pk.push(Q.bank[n]);render();if(Q.pk.length===Q.bank.length)checkO()}

const XN=9;
function cpick(){app.innerHTML=`<div class="top"><button class="btn g" onclick="go('games')">${ic('back')}</button><h1>${ic('search')} Crucipuzzle</h1></div>

function xstart(id,w0){
  const pool=(id==='all'?VL().flatMap(l=>l.words):(D.lessons.find(l=>l.id===id)||{words:[]}).words).filter(w=>(w.i||w.e||'').trim());
  const cand=uq(pool).map(x=>({x,s:[...bare(x.w)].map(base).filter(isL).join('')})).filter(o=>o.s.length>=3&&o.s.length<=8);
  if(cand.length<3)return;
  const dirs=[[0,1],[1,0]],N=XN;let ws,g;
  for(let t=0;t<40;t++){
    ws=shuf(cand).slice(0,5).sort((a,b)=>b.s.length-a.s.length).map(o=>({x:o.x,s:o.s,cells:[],found:0}));g=Array(N*N).fill('');let all=true;
    for(const w of ws){let ok=false;
      for(let a=0;a<300&&!ok;a++){const d=dirs[Math.floor(Math.random()*2)],L=w.s.length,r=Math.floor(Math.random()*(N-d[0]*(L-1))),c=Math.floor(Math.random()*(N-d[1]*(L-1)));
        const cs=[...w.s].map((_,k)=>(r+d[0]*k)*N+c+d[1]*k);
        if(cs.every((p,k)=>!g[p]||g[p]===w.s[k])){cs.forEach((p,k)=>g[p]=w.s[k]);w.cells=cs;ok=true}}
      if(!ok){all=false;break}}
    if(all)break}
  const fill='AAEEIIOOUUBCDFGLMNPRSTVZ';g=g.map(c=>c||fill[Math.floor(Math.random()*fill.length)]);

function cross(){
  if(!X)return go('games');
  app.innerHTML=`<div class="top"><button class="btn g" onclick="go('games')">${ic('back')}</button><h1>${ic('search')} Crucipuzzle</h1><span class="stars" style="color:#f59f00">${ic('star')} ${X.w}</span></div>
  <div class="q"><p class="note" style="margin:0">Tocca la prima e l'ultima lettera di ogni parola.</p>
  <div class="xg">${X.g.map((c,i)=>`<button class="xc ${X.fd.includes(i)?'fd':''} ${X.sel===i?'sel':''} ${X.bad.includes(i)?'ko':''}" onclick="xc(${i})">${c}</button>`).join('')}</div>
  <div class="xw">${X.ws.map((w,i)=>`<span class="cw ${w.found?'fd':''}"><span>${pic(w.x)}</span><span>${esc(bare(w.x.w))}</span></span>`).join('')}</div>

function xc(i){

  const a=X.sel,N=XN;X.sel=null;if(a===i)return render();
  const ra=Math.floor(a/N),ca=a%N,rb=Math.floor(i/N),cb=i%N,dr=rb-ra,dc=cb-ca;

  const st=Math.max(Math.abs(dr),Math.abs(dc)),cells=[];for(let k=0;k<=st;k++)cells.push((ra+k*Math.sign(dr))*N+ca+k*Math.sign(dc));

function spick(i){if(Q.busy)return;const o=Q.opts[i],b=document.getElementById('so'+i);
  if(V.t==='hear')seq([{who:'A',t:o.t}]);
  if(o.r){Q.busy=1;b.classList.add('ok');if(!Q.tried)Q.ok++;setTimeout(()=>{Q.i++;Q.tried=false;Q.busy=0;render()},2000)}
  else{b.classList.add('ko');Q.tried=true}}
/* ---- editor situazioni ---- */
function sedit(){const s=SC();if(!s||!owner)return go('edit');
  app.innerHTML=`<div class="ed"><div class="top"><button class="btn g" onclick="go('edit')">${ic('back')}</button><h1>${ic('pen')} Situazione</h1></div>
  <div class="row"><input value="${esc(s.name)}" onchange="SC().name=this.value"></div>
  <div class="row"><input class="im" list="imgs" placeholder="icona" value="${esc(s.i||'')}" onchange="SC().i=this.value.trim()"><input class="im" list="imgs" placeholder="studente" value="${esc(s.a||'')}" onchange="SC().a=this.value.trim()"><input class="im" list="imgs" placeholder="altra persona" value="${esc(s.b||'')}" onchange="SC().b=this.value.trim()"></div>
  ${dl()}<p class="note">Immagini: icona della situazione, studente, altra persona (scegli dall'elenco, es. ill/av-donna.svg).</p>
  <label style="display:flex;gap:12px;align-items:center;margin:10px 0;font-size:18px"><input type="checkbox" ${s.hid?'':'checked'} style="width:28px;height:28px;flex:none" onchange="SC().hid=!this.checked"> ${ic('eye')} Visibile agli studenti</label>
  <p class="note">Dialogo (una riga per frase, A: studente, B: altra persona):</p>
  <textarea onchange="pD(this.value)">${esc((s.dlg||[]).map(x=>x.who+': '+x.t).join('\n'))}</textarea>
  <p class="note">Frasi utili (immagine | frase):</p>
  <textarea onchange="pP(this.value)">${esc((s.phr||[]).map(x=>(x.i||'')+' | '+x.t).join('\n'))}</textarea>
  <p class="note">Domande (frase dell'altro | risposta giusta | sbagliata | sbagliata):</p>
  <textarea onchange="pQ(this.value)">${esc((s.qz||[]).map(x=>[x.q,x.ok,...x.no].join(' | ')).join('\n'))}</textarea>
  <button class="btn" style="width:100%" onclick="pub()">${ic('save')} Scarica contenuti.json</button>
  <button class="btn g" style="width:100%;margin-top:10px" onclick="delS()">${ic('trash')} Elimina situazione</button>
  <p class="note" id="msg">Le modifiche diventano visibili agli studenti solo dopo aver caricato su GitHub il file scaricato.</p></div>`}
function pD(v){SC().dlg=v.split('\n').filter(l=>l.trim()).map(l=>({who:/^\s*B\s*:/i.test(l)?'B':'A',t:l.replace(/^\s*[ABab]\s*:\s*/,'').trim()}))}
function pP(v){SC().phr=v.split('\n').filter(l=>l.includes('|')).map(l=>{const [e,...r]=l.split('|');return{i:e.trim(),t:r.join('|').trim()}})}
function pQ(v){SC().qz=v.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a.length>=3&&a[0]&&a[1]).map(a=>({q:a[0],ok:a[1],no:a.slice(2).filter(Boolean)}))}
function addS(){D.scenes=D.scenes||[];const s={id:'s'+Date.now(),name:'Nuova situazione',i:'ill/ciao.svg',a:'av/joy.png',b:'av/paul.png',dlg:[],phr:[],qz:[]};D.scenes.push(s);go('sedit',s.id)}
function delS(){if(!confirm('Eliminare questa situazione?'))return;D.scenes=D.scenes.filter(x=>x.id!==V.id);go('edit')}
let FI=null;
function gridW(l){const n=l.words.length;
  return `<div class="grid">${l.words.map((w,i)=>`<button class="card" ${(n%2&&i===n-1)?'style="grid-column:1/-1"':''} onclick="speak(L().words[${i}].w)"><span class="e">${pic(w)}</span><span class="w">${esc(w.w)}</span><span class="s">${ic('spk')}</span></button>`).join('')}</div>`}
function bigW(l){const n=l.words.length,w=l.words[FI];
  return `<div class="q"><button class="card" style="min-height:280px" onclick="speak(L().words[FI].w)">${(w.e||w.i)?`<span class="e" style="font-size:110px">${pic(w)}</span>`:''}<span class="w" style="font-size:32px">${esc(w.w)}</span><span class="s">${ic('spk')}</span></button>
  <div style="display:flex;gap:10px;margin-top:14px"><button class="btn g" style="flex:1" onclick="fnav(-1)" ${FI===0?'disabled':''}>${ic('back')} Indietro</button><button class="btn" style="flex:1" onclick="fnav(1)" ${FI===n-1?'disabled':''}>Avanti ${ic('next')}</button></div>
  <p class="note">${FI+1} / ${n}</p>
  <button class="btn g" style="width:100%" onclick="FI=null;render()">${ic('grid')} Tutte le parole</button></div>`}
function foc(i){FI=i;speak(L().words[i].w);render()}
function fnav(d){const n=L().words.length;FI=Math.max(0,Math.min(n-1,FI+d));speak(L().words[FI].w);render()}
function phrW(l){const a=F(l);if(!a.length)return '<p class="note" style="text-align:center">Presto!</p>';
  return `<div class="grid" style="grid-template-columns:1fr">${a.map(x=>`<button class="card" style="flex-direction:row;gap:14px;min-height:80px;justify-content:flex-start;padding:12px 16px;text-align:left" data-t="${esc(x.t)}" onclick="speak(this.dataset.t)"><span class="e" style="font-size:44px">${pic(x)}</span><span class="w" style="flex:1">${esc(x.t)}</span><span>${ic('spk')}</span></button>`).join('')}</div>`}
const PRON=['io','tu','lei/lui','noi','voi','loro'];
const cl=c=>c==='m'?' class="cm"':c==='f'?' class="cf"':'';
const pc=(c,g)=>g.pr&&c.includes(' ')?`<b style="color:var(--pri)">${esc(c.split(' ')[0])}</b> ${esc(c.split(' ').slice(1).join(' '))}`:esc(c);
function tT(g){const rc=g.rc||[],cc=g.cc||[];
  return `<div style="overflow-x:auto"><table class="gt"><tr>${g.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${g.rows.map((r,i)=>`<tr>${r.map((c,j)=>{const k=rc[i]||cc[j]||'';return j?`<td${cl(k)}>${pc(c,g)}</td>`:`<td${cl(k)}>${esc(c)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function vT(g){const col=['cg','ce','ci'];
  return `<div style="overflow-x:auto"><table class="gt"><tr><th></th>${g.heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr><tr><th></th>${g.verbs.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>${PRON.map((p,i)=>`<tr><td>${p}</td>${g.stems.map((st,j)=>{const e=g.ends[j][i];return `<td>${esc(st)}<b class="${col[j]}">${esc(e)}</b></td>`}).join('')}</tr>`).join('')}</table></div>`}
function gramW(l){const a=l.g||[];if(!a.length)return '<p class="note" style="text-align:center">Presto!</p>';
  return a.map(g=>`<div class="card" style="align-items:stretch;text-align:left;margin-bottom:12px;padding:14px"><span class="w" style="color:var(--pri)">${esc(g.h)}</span>${g.k==='v'?vT(g):g.k==='t'?tT(g):g.k==='n'?`<p style="margin:8px 0 0;font-size:18px">${esc(g.t)}</p>`:(g.ex||[]).map(e=>`<button class="btn g" style="text-align:left;margin-top:8px;font-weight:600" data-t="${esc(e)}" onclick="speak(this.dataset.t)">${ic('spk')} ${esc(e)}</button>`).join('')}</div>`).join('')}
function pPh(v){L().ph=v.split('\n').filter(l=>l.includes('|')).map(l=>{const [e,...r]=l.split('|');return{i:e.trim(),t:r.join('|').trim()}})}
const dl=()=>`<datalist id="imgs">${IDX.map(f=>`<option value="${esc(f)}">`).join('')}</datalist>`;
function pG(v){L().g=v.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]&&a.length>1).map(a=>({h:a[0],ex:a.slice(1).filter(Boolean)}))}
const F=l=>{const seen=new Set();return [...(l.ph||[]),...(l.s||[])].filter(x=>x.t&&!seen.has(x.t)&&seen.add(x.t))};
const pic=x=>x.i?`<img class="pi" alt="" src="img/${encodeURI(x.i)}">`:esc(x.e);
const uq=a=>{const seen=new Set();return a.filter(x=>!seen.has(x.i||x.e)&&seen.add(x.i||x.e))};
function lt(id,b,t){V={p:'lesson',id,b,t};Q=null;H=null;M=null;X=null;FI=null;SEQ++;try{speechSynthesis.cancel()}catch(e){}render()}
function dlgW(l){const dl=l.dlg||[];if(!dl.length)return '<p class="note" style="text-align:center">Presto!</p>';
  return `<button class="btn" style="width:100%;margin-bottom:14px" onclick="seq(L().dlg)">${ic('play')} Ascolta tutto</button>`+dl.map((x,i)=>`<div style="display:flex;gap:8px;margin-bottom:10px;align-items:center;${x.who==='A'?'flex-direction:row-reverse':''}"><span style="font-size:52px;flex:none">${x.who==='A'?im(l.a||'av/joy.png'):im(l.b||'av/paul.png')}</span><button class="card" style="width:auto;min-height:0;max-width:78%;padding:12px 14px;text-align:left;align-items:flex-start;${x.who==='A'?'background:var(--pri);color:#fff;border-color:var(--pri)':''}" onclick="seq([L().dlg[${i}]])"><span class="w" style="font-weight:600">${esc(x.t)}</span></button></div>`).join('')}
function dq(l){const qz=l.qz||[];if(!qz.length)return '<p class="note" style="text-align:center">Presto!</p>';
  const k='dq'+V.t+l.id,hear=V.t==='hear',mix=V.t==='read';
  if(!Q||Q.k!==k)mkQ(k,()=>({k,qs:mix?shuf(qz).map((q,n)=>({...q,mode:(n%2&&q.ok.trim().split(/\s+/).length>=2)?'r':'c'})):shuf(qz),i:0,ok:0,tried:false,busy:0,pk:[],bank:null}));
  if(Q.i>=Q.qs.length)return endW(l.id+'d'+V.t);
  const q=Q.qs[Q.i],av=`<div style="font-size:56px">${im(l.b||'av/paul.png')}</div>`,bar=`<div class="bar"><i style="width:${Q.i/Q.qs.length*100}%"></i></div>`;
  if(hear)setTimeout(()=>{if(Q&&Q.k===k&&Q.qs[Q.i]===q)seq([{who:'B',t:q.q}])},300);
  if(q.mode==='r'){
    if(!Q.bank)Q.bank=shuf(q.ok.trim().split(/\s+/).map(w=>({w})));
    return `<div class="q">${bar}${av}<p style="font-size:24px;font-weight:700;margin:10px 0 4px">${esc(q.q)}</p><button class="btn g" onclick="seq([{who:'B',t:Q.qs[Q.i].q}])">${ic('spk')}</button>
    <p class="note" style="margin:10px 0 0">Metti in ordine la risposta.</p>
    <div class="ans" id="ans">${Q.pk.map((o,n)=>`<button class="chip" onclick="unp(${n})">${esc(o.w)}</button>`).join('')}</div>
    <div class="ans bank">${Q.bank.map((o,n)=>Q.pk.includes(o)?'':`<button class="chip" onclick="pk(${n})">${esc(o.w)}</button>`).join('')}</div>${skipBtn()}</div>`}
  Q.opts=shuf([{t:q.ok,r:1},...q.no.map(t=>({t,r:0}))]);
  return `<div class="q">${bar}${av}
  ${hear?`<button class="spk" style="width:96px;height:96px;font-size:46px;margin:8px auto" onclick="seq([{who:'B',t:Q.qs[Q.i].q}])">${ic('spk')}</button>`:`<p style="font-size:24px;font-weight:700;margin:10px 0 14px">${esc(q.q)}</p>`}
  <div style="display:grid;gap:10px">${Q.opts.map((o,i)=>`<button class="card opt" id="so${i}" style="min-height:64px;padding:12px" onclick="spick(${i})"><span class="w">${esc(o.t)}</span></button>`).join('')}</div>${skipBtn()}</div>`}
/* ---- area insegnante ---- */
function edit(){
  if(!owner)return go('home');
  const l=L()||D.lessons[0];
  if(!l){D.lessons.push({id:'l'+Date.now(),name:'Nuova lezione',i:'ill/libro.svg',words:[]});return edit()}
  V.id=l.id;
  app.innerHTML=`<div class="ed"><div class="top"><button class="btn g" onclick="go('home')">${ic('back')}</button><h1>${ic('pen')} Gestisci</h1></div>
  <div class="tabs" style="flex-wrap:wrap">${D.lessons.map(x=>`<button class="${x.id===l.id?'on':''}" style="flex:none;padding:8px 12px" onclick="V.id='${x.id}';edit()">${im(x.i)} ${esc(x.name)}</button>`).join('')}<button style="flex:none;padding:8px 12px" onclick="addL()">${ic('plus')}</button></div>
  <div class="row"><span class="th">${im(l.i)}</span><input class="im" list="imgs" placeholder="icona" value="${esc(l.i||'')}" onchange="L().i=this.value.trim();dirty=1;edit()"><input value="${esc(l.name)}" placeholder="Nome lezione" onchange="L().name=this.value;dirty=1"><button onclick="delL()">${ic('trash')}</button></div>${dl()}
  <label style="display:flex;gap:12px;align-items:center;margin:10px 0;font-size:18px"><input type="checkbox" ${l.hid?'':'checked'} style="width:28px;height:28px;flex:none" onchange="L().hid=!this.checked"> ${ic('eye')} Visibile agli studenti</label>
  <p class="note">Parole (immagine + italiano, con articolo):</p>
  ${l.words.map((w,i)=>`<div class="row"><span class="th">${pic(w)}</span><input value="${esc(w.w)}" onchange="L().words[${i}].w=this.value;dirty=1"><input class="im" list="imgs" placeholder="immagine" value="${esc(w.i||'')}" onchange="L().words[${i}].i=this.value.trim();dirty=1;edit()"><button onclick="L().words.splice(${i},1);dirty=1;edit()">${ic('close')}</button></div>`).join('')}
  <button class="btn g" style="width:100%;margin:6px 0 16px" onclick="L().words.push({w:'',i:''});dirty=1;edit()">${ic('plus')} Aggiungi parola</button>
  <p class="note">Frasi brevi (immagine + frase):</p>
  ${(l.s=l.s||[]).map((x,i)=>`<div class="row"><span class="th">${pic(x)}</span><input value="${esc(x.t)}" onchange="L().s[${i}].t=this.value;dirty=1"><input class="im" list="imgs" placeholder="immagine" value="${esc(x.i||'')}" onchange="L().s[${i}].i=this.value.trim();dirty=1;edit()"><button onclick="L().s.splice(${i},1);dirty=1;edit()">${ic('close')}</button></div>`).join('')}
  <button class="btn g" style="width:100%;margin:6px 0 16px" onclick="L().s.push({t:'',i:''});dirty=1;edit()">${ic('plus')} Aggiungi frase</button>
  <p class="note">Frasi utili (immagine | frase):</p>
  <textarea onchange="pPh(this.value)">${esc((l.ph||[]).map(x=>(x.i||'')+' | '+x.t).join('\n'))}</textarea>
  <p class="note">Grammatica ed esercizi: scrivimeli in chat e li aggiorno io.</p>
  <p class="note">Dialoghi, grammatica ed esercizi: scrivimeli in chat e li aggiorno io.</p>
  <button class="btn" style="width:100%" onclick="pub()">${ic('save')} Scarica contenuti.json</button>
  <p class="note" id="msg">Le modifiche diventano visibili agli studenti solo dopo aver caricato su GitHub il file scaricato. Per l'immagine scegli un nome dall'elenco (ill/… sono le illustrazioni) oppure scrivi il nome di una tua foto nella cartella img.</p></div>`;
}
function addL(){const l={id:'l'+Date.now(),name:'Nuova lezione',i:'ill/libro.svg',words:[]};D.lessons.push(l);V.id=l.id;dirty=1;edit()}
function delL(){if(!confirm('Eliminare questa lezione?'))return;D.lessons=D.lessons.filter(x=>x.id!==V.id);V.id=null;dirty=1;edit()}
async function pub(){
  D.lessons.forEach(l=>{l.words=l.words.filter(w=>w.w.trim());l.s=(l.s||[]).filter(x=>x.t.trim())});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='contenuti.json';document.body.appendChild(a);a.click();a.remove();
  const m=document.getElementById('msg');if(m)m.textContent='File contenuti.json scaricato. Caricalo su GitHub al posto di quello vecchio per pubblicare.';
}
owner=/docente/.test(location.search+location.hash);
if(PF.cur&&!CP())PF.cur=null;
loadPD();
if(!PF.list.length)V={p:'newp'};else if(!PF.cur)V={p:'who'};
render();
(async()=>{try{const r=await fetch('contenuti.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j&&j.lessons){D.lessons=j.lessons;if(j.title)D.title=j.title;if(V.p==='home'||V.p==='words')render()}}}catch(e){}})();
fetch('img/ill/index.json').then(r=>r.json()).then(j=>{IDX=j}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
